name: ChronoSieve CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64 (NEON)
            os: macos-15
            python: "3.13"
            avx2: "0"
            make_avx2: ""
            expected_simd: "NEON"
          - name: Linux x86_64 (AVX2)
            os: ubuntu-latest
            python: "3.12"
            avx2: "1"
            make_avx2: "AVX2=1"
            expected_simd: "AVX2"
          - name: Linux x86_64 (Portable Scalar)
            os: ubuntu-latest
            python: "3.11"
            avx2: "0"
            force_scalar: "1"
            make_avx2: ""
            expected_simd: "SCALAR"

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dev/test tools
        run: |
          python3 -m pip install --upgrade pip setuptools pytest numpy ruff mypy

      - name: Build native C11 CLI & verify <150 KB
        run: |
          make cli ${{ matrix.make_avx2 }}
          ./chronosieve info
          SIZE=$(wc -c < chronosieve)
          echo "Native CLI size: ${SIZE} bytes"
          test "${SIZE}" -lt 153600

      - name: Run C11 ASan + UBSan suite (SIMD & Scalar)
        run: |
          make test-c ${{ matrix.make_avx2 }}

      - name: Verify SIMD vs Scalar numerical parity (<1e-12)
        run: |
          make test-parity ${{ matrix.make_avx2 }}

      - name: Build and install Python C-extension
        env:
          CHRONOSIEVE_AVX2: ${{ matrix.avx2 }}
          CHRONOSIEVE_FORCE_SCALAR: ${{ matrix.force_scalar || '0' }}
        run: |
          python3 -m pip install --no-build-isolation --no-deps -e .
          python3 -c "import chronosieve as cs; b = cs.simd_backend(); print('Backend:', b); assert b == '${{ matrix.expected_simd }}'"

      - name: Run full pytest suite (Math proofs + MCP stdio + CLI)
        run: |
          pytest -v tests/

      - name: Lint C11 + Python (ruff + mypy)
        run: |
          make lint

  build-and-test-windows:
    name: Windows x86_64 (MSVC AVX2)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install dev/test tools
        run: |
          python -m pip install --upgrade pip setuptools pytest numpy ruff mypy

      - name: Build native C11 CLI (MSVC AVX2) & verify <150 KB
        shell: cmd
        run: |
          cl /nologo /std:c11 /O2 /MD /arch:AVX2 /D_CRT_SECURE_NO_WARNINGS /Iinclude /Icsrc csrc\edetector.c csrc\conformal.c csrc\fuser.c csrc\digest.c csrc\cli_main.c /Fe:chronosieve.exe /link /OPT:REF /OPT:ICF
          chronosieve.exe info
          python -c "import os; sz = os.path.getsize('chronosieve.exe'); print(f'Native CLI size: {sz} bytes'); assert sz < 153600, sz"

      - name: Run C11 Core Tests & AVX2 vs Scalar Parity (MSVC)
        shell: cmd
        run: |
          cl /nologo /std:c11 /O2 /MD /arch:AVX2 /D_CRT_SECURE_NO_WARNINGS /Iinclude /Icsrc csrc\edetector.c csrc\conformal.c csrc\fuser.c csrc\digest.c tests\c\test_c_core.c /Fe:test_c_avx2.exe
          test_c_avx2.exe
          cl /nologo /std:c11 /O2 /MD /DCS_FORCE_SCALAR=1 /D_CRT_SECURE_NO_WARNINGS /Iinclude /Icsrc csrc\edetector.c csrc\conformal.c csrc\fuser.c csrc\digest.c tests\c\test_c_core.c /Fe:test_c_scalar.exe
          test_c_scalar.exe
          cl /nologo /std:c11 /O2 /MD /arch:AVX2 /D_CRT_SECURE_NO_WARNINGS /Iinclude /Icsrc csrc\edetector.c csrc\conformal.c csrc\fuser.c csrc\digest.c tests\c\test_parity.c /Fe:parity_avx2.exe
          cl /nologo /std:c11 /O2 /MD /DCS_FORCE_SCALAR=1 /D_CRT_SECURE_NO_WARNINGS /Iinclude /Icsrc csrc\edetector.c csrc\conformal.c csrc\fuser.c csrc\digest.c tests\c\test_parity.c /Fe:parity_scalar.exe
          parity_avx2.exe > parity_avx2.txt
          parity_scalar.exe > parity_scalar.txt
          python tests\c\check_parity.py parity_avx2.txt parity_scalar.txt
          del /q test_c_avx2.exe test_c_scalar.exe parity_avx2.exe parity_scalar.exe parity_avx2.txt parity_scalar.txt *.obj

      - name: Build and install Python C-extension (MSVC AVX2)
        env:
          CHRONOSIEVE_AVX2: "1"
        run: |
          python -m pip install --no-build-isolation --no-deps -e .
          python -c "import chronosieve as cs; b = cs.simd_backend(); print('Backend:', b); assert b == 'AVX2'"

      - name: Run full pytest suite (Math proofs + MCP stdio + CLI)
        run: |
          pytest -v tests/

      - name: Lint Python (ruff + mypy)
        run: |
          ruff check python/ tests/ benchmarks/ examples/ scripts/ setup.py
          mypy python/chronosieve
