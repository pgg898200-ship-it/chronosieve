<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 410" width="920" height="410" role="img" aria-label="Pre-Control E-Reset Conformal PID Shock Recovery &amp; Real-World Coverage">
  <title>Pre-Control E-Reset Conformal PID Shock Recovery &amp; Real-World Coverage</title>
  <desc>Comparison of Pre-Control E-Reset PID, Rolling-D PID, and Pure P+I PID under 5x volatility shocks and Sunspots.</desc>
