  <text x="28" y="60" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12">Target coverage 1 - alpha = 90.0% · Exact zero-exp E-Reset breaks integral windup immediately after volatility jumps</text>
