  <text x="176" y="205.0" text-anchor="end" fill="#c9d1d9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400">Raw CSV</text>
  <rect x="186" y="190" width="106.8" height="22" rx="4" fill="#818cf8"/>
  <text x="299.8" y="205.0" fill="#8b949e" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="10.5" font-weight="400">14,577</text>
  <text x="176" y="247.0" text-anchor="end" fill="#c9d1d9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400">TSLN-style Delta</text>
  <rect x="186" y="232" width="62.9" height="22" rx="4" fill="#fbbf24"/>
  <text x="255.9" y="247.0" fill="#8b949e" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="10.5" font-weight="400">8,591</text>
  <text x="176" y="289.0" text-anchor="end" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="700">ChronoSieve PLA</text>
