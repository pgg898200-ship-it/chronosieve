<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 415" width="920" height="415" role="img" aria-label="Real OpenAI tiktoken o200k_base Token Compression">
  <title>Real OpenAI tiktoken o200k_base Token Compression</title>
  <desc>Token counts on Mauna Loa CO2 and 10k telemetry comparing Raw JSON, CSV, TSLN, and ChronoSieve.</desc>
  <rect x="0.5" y="0.5" width="919" height="414" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="28" y="38" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="700">Real OpenAI tiktoken (o200k_base) Token Reduction</text>
  <text x="28" y="60" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12">Measured with real tiktoken v0.14.0 (o200k_base) · Guaranteed L_inf error bound + verbatim anomalies (lower is better)</text>
  <rect x="24" y="78" width="424" height="296" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <rect x="472" y="78" width="424" height="296" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="44" y="104" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700">Mauna Loa CO2 (N=2,225, Full Series, L_inf&lt;=1 ppm)</text>
  <text x="44" y="121" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11">No wake-up gating · 107 Swing PLA segments (20.8x PLA)</text>
  <text x="492" y="104" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700">10,000-Tick Telemetry (2 Shifts + 3 Sharp Anomalies)</text>
  <text x="492" y="121" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11">Wake-Up Gate + Pre-Control E-Reset PID + Swing PLA</text>
