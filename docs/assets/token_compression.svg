  <text x="28" y="401" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5">Source: benchmarks/results_m4.json · Zero runtime dependencies in chronosieve (tiktoken used in benchmark harness only).</text>
